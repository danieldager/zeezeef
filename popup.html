<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X Post Text Capture</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #15202b;
        --card: #1e2a36;
        --accent: #1d9bf0;
        --accent-press: #1a8cd8;
        --text: #e7ecf0;
        --muted: #8899a6;
        --danger: #f4212e;
      }
      * { box-sizing: border-box; }
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      h1 {
        margin: 0 0 2px;
        font-size: 14px;
        font-weight: 700;
      }
      .scope {
        margin: 0 0 12px;
        font-size: 11px;
        color: var(--muted);
      }
      .count-card {
        background: var(--card);
        border-radius: 10px;
        padding: 12px;
        text-align: center;
        margin-bottom: 12px;
      }
      .count {
        font-size: 30px;
        font-weight: 800;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .count-label {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      .ops {
        font-size: 10px;
        color: var(--muted);
        margin-top: 8px;
        word-break: break-word;
        min-height: 12px;
      }
      .row { display: flex; gap: 8px; }
      button {
        flex: 1;
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        color: #fff;
        transition: background 0.12s ease, opacity 0.12s ease;
      }
      #export { background: var(--accent); }
      #export:hover { background: var(--accent-press); }
      #export:disabled { opacity: 0.45; cursor: not-allowed; }
      #reset {
        background: transparent;
        border: 1px solid #38444d;
        color: var(--text);
      }
      #reset:hover { border-color: var(--danger); color: var(--danger); }
      .status {
        margin-top: 10px;
        font-size: 11px;
        color: var(--muted);
        min-height: 14px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>X Post Text Capture</h1>
    <p class="scope">Captures the X posts you scroll. Export when done.</p>

    <div class="count-card">
      <div class="count" id="count">0</div>
      <div class="count-label">posts captured</div>
      <div class="ops" id="ops"></div>
    </div>

    <div class="row">
      <button id="export">Export NDJSON</button>
      <button id="reset">Reset</button>
    </div>

    <div class="status" id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
