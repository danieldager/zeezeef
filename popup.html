<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zeezeef</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #15202b;
        --card: #1e2a36;
        --field: #0f1923;
        --accent: #1d9bf0;
        --accent-press: #1a8cd8;
        --text: #e7ecf0;
        --muted: #8899a6;
        --danger: #f4212e;
        --warn: #ffd479;
        --border: #38444d;
      }
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      h1 { margin: 0 0 2px; font-size: 14px; font-weight: 700; }
      .scope { margin: 0 0 12px; font-size: 11px; color: var(--muted); }
      .count-card {
        background: var(--card); border-radius: 10px; padding: 12px;
        text-align: center; margin-bottom: 12px;
      }
      .count { font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
      .count-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
      .ops { font-size: 10px; color: var(--muted); margin-top: 8px; word-break: break-word; min-height: 12px; }
      .row { display: flex; gap: 8px; }
      button {
        flex: 1; appearance: none; border: 0; border-radius: 999px; padding: 9px 12px;
        font-size: 13px; font-weight: 700; cursor: pointer; color: #fff;
        transition: background 0.12s ease, opacity 0.12s ease;
      }
      #export { background: var(--accent); }
      #export:hover { background: var(--accent-press); }
      #export:disabled { opacity: 0.45; cursor: not-allowed; }
      #reset { background: transparent; border: 1px solid var(--border); color: var(--text); }
      #reset:hover { border-color: var(--danger); color: var(--danger); }
      .status { margin-top: 10px; font-size: 11px; color: var(--muted); min-height: 14px; text-align: center; }

      /* --- autopilot panel --- */
      .divider { border: 0; border-top: 1px solid var(--border); margin: 14px 0 10px; }
      .section-title { font-size: 12px; font-weight: 700; margin: 0 0 2px; }
      .warn {
        font-size: 10px; color: var(--warn); margin: 0 0 10px; line-height: 1.35;
      }
      label.field { display: block; font-size: 10px; color: var(--muted); margin: 0 0 3px; }
      select, input[type="number"], textarea {
        width: 100%; background: var(--field); color: var(--text);
        border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px;
        font: inherit; font-size: 12px;
      }
      select:disabled, input:disabled, textarea:disabled { opacity: 0.5; }
      textarea { resize: vertical; min-height: 44px; }
      .field-block { margin-bottom: 8px; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
      .inline { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin: 4px 0 10px; }
      .inline input { width: auto; }
      #ap-toggle { width: 100%; flex: none; background: var(--accent); }
      #ap-toggle:hover { background: var(--accent-press); }
      #ap-toggle.danger { background: var(--danger); }
      .ap-status { margin-top: 8px; font-size: 11px; color: var(--muted); min-height: 14px; text-align: center; }
    </style>
  </head>
  <body>
    <h1>Zeezeef</h1>
    <p class="scope">Captures the X posts you scroll. Export when done.</p>

    <div class="count-card">
      <div class="count" id="count">0</div>
      <div class="count-label">posts captured</div>
      <div class="ops" id="ops"></div>
    </div>

    <div class="row">
      <button id="export">Export NDJSON</button>
      <button id="reset">Reset</button>
    </div>
    <div class="status" id="status"></div>

    <hr class="divider" />

    <p class="section-title">Autopilot · active collection</p>
    <p class="warn">
      ⚠ Automates scrolling &amp; topic-switching — this is bot-like activity that
      X's ToS restricts and can get your account limited or suspended. Prefer a
      dedicated research account.
    </p>

    <div class="field-block">
      <label class="field" for="ap-mode">Source</label>
      <select id="ap-mode">
        <option value="trending">Trending topics (auto)</option>
        <option value="manual">Manual topic list</option>
        <option value="current">Current page only</option>
      </select>
    </div>

    <div class="field-block" id="ap-manual-wrap" style="display: none">
      <label class="field" for="ap-manual">Topics / hashtags (one per line)</label>
      <textarea id="ap-manual" placeholder="#climate&#10;election fraud&#10;@someuser"></textarea>
    </div>

    <div class="grid2">
      <div>
        <label class="field" for="ap-dwell">Dwell / topic (s)</label>
        <input type="number" id="ap-dwell" min="10" max="3600" step="5" value="90" />
      </div>
      <div>
        <label class="field" for="ap-cadence">Scroll every (s)</label>
        <input type="number" id="ap-cadence" min="0.5" max="30" step="0.5" value="2" />
      </div>
    </div>
    <div class="grid2">
      <div>
        <label class="field" for="ap-maxtopics">Max topics</label>
        <input type="number" id="ap-maxtopics" min="1" max="100" step="1" value="8" />
      </div>
      <div>
        <label class="field" for="ap-sessionmax">Session cap (min)</label>
        <input type="number" id="ap-sessionmax" min="1" max="240" step="1" value="20" />
      </div>
    </div>

    <div class="inline">
      <input type="checkbox" id="ap-loop" />
      <label for="ap-loop">Loop (restart when topics run out)</label>
    </div>

    <button id="ap-toggle">▶ Start autopilot</button>
    <div class="ap-status" id="ap-status"></div>

    <script src="popup.js"></script>
  </body>
</html>
